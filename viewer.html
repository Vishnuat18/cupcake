<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PDF Viewer - Sem 6 Notes</title>
    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="icon" type="image/png" href="assets/icon.png">
    <style>
        /* Custom Premium Scrollbar */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(99, 102, 241, 0.2);
            border-radius: 20px;
            border: 2px solid transparent;
            background-clip: padding-box;
            transition: all 0.3s ease;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: rgba(99, 102, 241, 0.5);
        }

        body, html {
            height: 100vh;
            height: 100dvh; /* Dynamic viewport height for mobile browsers */
            width: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
            background: #0f172a;
            display: flex;
            flex-direction: column;
            user-select: none;
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
        }

        @media print {
            body, html {
                display: none !important;
            }
        }
        .viewer-header {
            position: fixed;
            top: 10px;
            left: 10px;
            right: 10px;
            padding: 0.6rem 1rem;
            padding-top: calc(0.6rem + env(safe-area-inset-top, 0px));
            display: flex;
            align-items: center;
            justify-content: space-between;
            z-index: 2000;
            background: rgba(15, 23, 42, 0.9);
            backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            border-radius: 12px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
            box-sizing: border-box;
        }
        .viewer-title {
            font-family: 'Plus Jakarta Sans', sans-serif;
            font-weight: 700;
            font-size: 1.1rem;
            color: white;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            flex: 1;
            max-width: 250px;
        }
        
        #pdf-container {
            flex: 1;
            margin-top: 0px; /* Minimal gap as requested */
            margin-bottom: 125px;
            overflow-y: auto;
            overflow-x: hidden;
            position: relative;
            padding: 0 0.5rem 0.5rem; /* Remove top padding */
            display: flex;
            flex-direction: column;
            align-items: center;
            scroll-behavior: smooth;
            -webkit-overflow-scrolling: touch;
            background: #0f172a;
        }
        
        .main-canvas-wrapper {
            position: relative;
            transition: transform 0.1s ease-out, opacity 0.3s ease-out;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
            transform-origin: center center;
            touch-action: none;
            margin: 1rem 0 2rem 0;
            width: 95%; /* Boxed look */
            max-width: 800px;
            display: flex;
            justify-content: center;
            background: white;
            border-radius: 12px;
            overflow: hidden;
            opacity: 0; /* Hidden initially */
            pointer-events: none;
        }

        .main-canvas-wrapper.sliding-left {
            transform: translateX(-50px);
            opacity: 0;
        }

        .main-canvas-wrapper.sliding-right {
            transform: translateX(50px);
            opacity: 0;
        }

        canvas {
            display: block;
            max-width: 100%;
            height: auto !important; /* Force aspect ratio compliance */
            background: white;
        }

        /* Bottom Bar Styling */
        .bottom-nav-bar {
            position: fixed;
            bottom: calc(10px + env(safe-area-inset-bottom, 0px));
            left: 10px;
            right: 10px;
            padding: 0.6rem;
            display: flex;
            flex-direction: column;
            gap: 0.6rem;
            z-index: 2000;
            background: rgba(15, 23, 42, 0.9);
            backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            border-radius: 12px;
            box-shadow: 0 -8px 32px rgba(0, 0, 0, 0.4);
        }

        .slider-container {
            width: 100%;
            display: flex;
            align-items: center;
            gap: 1rem;
            padding: 0 1rem;
        }

        input[type="range"] {
            flex: 1;
            appearance: none;
            -webkit-appearance: none;
            background: rgba(255, 255, 255, 0.1);
            height: 4px;
            border-radius: 2px;
            outline: none;
        }

        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 16px;
            height: 16px;
            background: var(--primary);
            border-radius: 50%;
            cursor: pointer;
            box-shadow: 0 0 10px rgba(99, 102, 241, 0.5);
            transition: var(--transition);
        }

        input[type="range"]::-webkit-slider-thumb:hover {
            transform: scale(1.2);
            background: var(--primary-light);
        }

        .thumbnail-bar {
            display: flex;
            gap: 0.8rem;
            overflow-x: auto;
            padding: 0.5rem;
            scroll-snap-type: x mandatory;
            scrollbar-width: none; /* Firefox */
        }

        .thumbnail-bar::-webkit-scrollbar {
            display: none; /* Chrome/Safari */
        }

        .thumbnail-item {
            flex: 0 0 80px;
            height: 110px;
            background: rgba(255, 255, 255, 0.05);
            border: 2px solid transparent;
            border-radius: 8px;
            overflow: hidden;
            cursor: pointer;
            transition: var(--transition);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            position: relative;
        }

        .thumbnail-item.active {
            border-color: var(--primary);
            background: rgba(99, 102, 241, 0.1);
            transform: translateY(-5px);
        }

        .thumbnail-item canvas {
            width: 100%;
            height: 80px;
            object-fit: cover;
        }

        .thumbnail-item .page-label {
            font-size: 0.7rem;
            padding: 2px 0;
            font-weight: 600;
        }

        #page-indicator {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.4rem 0.8rem;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 8px;
            font-family: 'JetBrains Mono', 'Roboto Mono', monospace;
            font-size: 0.8rem;
            font-weight: 700;
            color: var(--primary-light);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        /* Premium Floating Download Button */
        .floating-dl-btn {
            position: fixed;
            bottom: 30px;
            right: 30px;
            padding: 0.8rem 1.6rem;
            background: linear-gradient(135deg, var(--primary), #6366f1);
            color: white;
            border: none;
            border-radius: 50px;
            font-family: 'Plus Jakarta Sans', sans-serif;
            font-weight: 700;
            font-size: 0.9rem;
            display: flex;
            align-items: center;
            gap: 12px;
            cursor: pointer;
            z-index: 4000;
            animation: fadeIn 0.6s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 10px 30px rgba(79, 70, 229, 0.4);
            transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .floating-dl-btn:hover {
            transform: translateY(-5px) scale(1.05);
            box-shadow: 0 15px 40px rgba(79, 70, 229, 0.6);
            filter: brightness(1.1);
        }

        .floating-dl-btn i {
            font-size: 1.1rem;
        }

        .loading-overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: #0f172a;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 3000;
            transition: opacity 0.5s ease;
        }

        .premium-loader-container {
            text-align: center;
            width: 80%;
            max-width: 300px;
            animation: fadeIn 0.8s ease-out;
        }

        .loader-logo {
            font-family: 'Outfit', sans-serif;
            font-weight: 800;
            font-size: 3.5rem;
            color: white;
            letter-spacing: -2px;
            margin-bottom: 2rem;
            text-shadow: 0 0 30px rgba(255, 255, 255, 0.2);
            animation: logoPulse 2s infinite ease-in-out;
        }

        .loader-progress-bar {
            width: 100%;
            height: 2px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 4px;
            overflow: hidden;
            margin-bottom: 2rem;
            position: relative;
        }

        .loader-progress-fill {
            position: absolute;
            top: 0; left: 0; height: 100%;
            width: 40%;
            background: var(--primary);
            box-shadow: 0 0 15px var(--primary);
            animation: progressMove 2s infinite ease-in-out;
        }

        .loader-status-text {
            font-family: 'Plus Jakarta Sans', sans-serif;
            font-size: 0.8rem;
            font-weight: 600;
            letter-spacing: 3px;
            color: #94a3b8;
            opacity: 0.8;
            text-transform: uppercase;
        }

        @keyframes logoPulse {
            0%, 100% { transform: scale(1); opacity: 0.9; }
            50% { transform: scale(1.05); opacity: 1; }
        }

        @keyframes progressMove {
            0% { left: -40%; width: 40%; }
            50% { left: 30%; width: 60%; }
            100% { left: 100%; width: 40%; }
        }

        .eye-btn {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--glass-border);
            color: white;
            cursor: pointer;
            transition: var(--transition);
            text-decoration: none;
        }

        .eye-btn:hover {
            background: var(--primary);
            border-color: var(--primary-light);
        }

        /* Desktop Layout - Web View Only */
        @media (min-width: 1024px) {
            body {
                overflow: hidden;
            }
            .viewer-header {
                top: 0;
                left: 0;
                right: 0;
                border-radius: 0;
                border-left: none;
                border-right: none;
                border-top: none;
                padding: 0.8rem 2rem;
            }
            .desktop-main-wrapper {
                display: flex;
                height: 100vh;
                padding-top: 65px; /* Header height */
                box-sizing: border-box;
            }
            #desktop-sidebar {
                width: 260px; /* Narrower sidebar */
                background: #0a0f1d; /* Deeper background */
                backdrop-filter: blur(25px);
                border-right: 1px solid rgba(255, 255, 255, 0.05);
                overflow-y: auto;
                display: flex;
                flex-direction: column;
                padding: 2rem 0;
                gap: 1.5rem;
                z-index: 50;
            }
            .bottom-nav-bar {
                display: none !important; /* Remove horizontal bar on desktop */
            }
            #pdf-container {
                flex: 1;
                margin-bottom: 0 !important;
                height: 100%;
                padding: 2rem;
                overflow-y: scroll;
                scroll-behavior: smooth;
                display: block; /* Vertical stack */
            }
            .main-canvas-wrapper {
                opacity: 1 !important;
                pointer-events: auto !important;
                margin: 0 auto 2rem auto !important;
                box-shadow: 0 15px 50px rgba(0, 0, 0, 0.4);
                transform: none !important;
                display: block;
                width: fit-content;
            }
            canvas {
                display: block;
                max-width: 100%;
                height: auto !important;
                background: white;
            }
            .desktop-page-skeleton {
                min-height: 90vh;
                background: rgba(255, 255, 255, 0.02);
                display: flex;
                align-items: center;
                justify-content: center;
                border: 1px dashed rgba(255, 255, 255, 0.1);
                border-radius: 4px;
            }
            .page-skeleton-loader {
                font-family: 'Outfit';
                font-size: 1rem;
                font-weight: 500;
                color: var(--text-muted);
                letter-spacing: 2px;
                text-transform: uppercase;
                animation: s6-pulse 1.5s infinite ease-in-out;
            }
            @keyframes s6-pulse {
                0%, 100% { opacity: 0.3; transform: scale(0.98); }
                50% { opacity: 0.7; transform: scale(1); }
            }
            .sidebar-subject-title {
                font-family: 'Plus Jakarta Sans', sans-serif;
                font-weight: 800;
                font-size: 0.7rem;
                text-transform: uppercase;
                letter-spacing: 2.5px;
                color: var(--primary-light);
                margin-bottom: 1.5rem;
                opacity: 0.8;
                padding-left: 0.5rem;
                display: flex;
                align-items: center;
                gap: 8px;
            }
            .sidebar-subject-title::before {
                content: '';
                display: inline-block;
                width: 12px;
                height: 2px;
                background: var(--primary);
                border-radius: 2px;
            }
            #sidebar-items-container {
                display: grid;
                grid-template-columns: 1fr;
                gap: 1.5rem;
                padding-bottom: 2rem;
            }
            .sidebar-thumb-item {
                display: flex;
                flex-direction: column;
                align-items: center;
                gap: 1rem;
                cursor: pointer;
                transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
                padding: 0.5rem;
            }
            .sidebar-thumb-item:hover {
                transform: translateY(-5px);
            }
            .sidebar-thumb-canvas-wrapper {
                width: 140px; /* Smaller as requested */
                background: white;
                border-radius: 6px;
                overflow: hidden;
                box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
                border: 2px solid transparent;
                transition: all 0.4s ease;
                display: flex;
                align-items: center;
                justify-content: center;
            }
            .sidebar-thumb-item.active .sidebar-thumb-canvas-wrapper {
                border-color: #6366f1; /* Vibrant active border */
                box-shadow: 0 0 25px rgba(99, 102, 241, 0.5); /* Strong glow as in image */
                transform: scale(1.05);
            }
            .sidebar-thumb-canvas-wrapper canvas {
                width: 100%;
                height: auto;
                display: block;
            }
            .sidebar-thumb-label {
                font-family: 'JetBrains Mono', monospace;
                font-size: 0.8rem;
                font-weight: 600;
                color: rgba(255, 255, 255, 0.4);
                transition: all 0.3s ease;
            }
            .sidebar-thumb-item.active .sidebar-thumb-label {
                color: #818cf8;
                font-weight: 800;
                transform: translateY(-2px);
            }
        }

        /* Mobile Adjustments */
        @media (max-width: 1023px) {
            #desktop-sidebar {
                display: none !important;
            }
            .desktop-main-wrapper {
                display: flex;
                flex-direction: column;
                height: 100%;
                width: 100%;
                position: relative;
            }
            #pdf-container {
                flex: 1;
                margin-top: 65px; /* Offset for header */
                margin-bottom: 0 !important;
                padding-bottom: 140px; /* Space for bottom nav */
                height: calc(100vh - 65px);
                overflow-y: auto;
            }
            .bottom-nav-bar {
                position: fixed;
                bottom: 15px;
                left: 10px;
                right: 10px;
                z-index: 2000;
            }
            .floating-dl-btn {
                bottom: 170px; /* Above the bottom nav bar */
                right: 15px;
                width: 48px;
                height: 48px;
                padding: 0;
                justify-content: center;
                border-radius: 50%;
                box-shadow: 0 8px 25px rgba(0, 0, 0, 0.4);
            }
            .floating-dl-btn span {
                display: none; /* Icon only on mobile */
            }
        }

        @media (max-width: 768px) {
            .viewer-header {
                padding: 0.6rem 0.8rem;
                gap: 0.5rem;
            }
            .viewer-header div:first-child {
                gap: 0.6rem !important;
            }
            .viewer-title {
                max-width: 160px;
                font-size: 0.95rem;
            }
            .viewer-header img {
                display: none;
            }
            #page-indicator {
                padding: 0.3rem 0.6rem !important;
                font-size: 0.7rem !important;
            }
            .eye-btn {
                width: 50px;
                height: 34px;
                font-size: 0.85rem;
            }
            #pdf-container {
                padding: 0.4rem;
            }
            .bottom-nav-bar {
                padding: 0.5rem;
                gap: 0.5rem;
            }
            .slider-container {
                padding: 0 0.5rem;
                gap: 0.6rem;
            }
            .thumbnail-item {
                flex: 0 0 55px;
                height: 75px;
            }
            .thumbnail-item canvas {
                height: 55px;
            }
            .thumbnail-item .page-label {
                font-size: 0.6rem;
            }
        }

        @media (max-width: 380px) {
            .viewer-title {
                max-width: 120px;
            }
            #full-screen-toggle {
                display: none;
            }
        }
    </style>
</head>
<body>
    <header class="viewer-header glass">
        <div style="display: flex; align-items: center; gap: 1rem;">
            <a id="back-link" href="#" class="back-btn">
                <i class="fas fa-arrow-left"></i>
            </a>
            <div id="viewer-title" class="viewer-title" style="font-weight: 800; font-family: 'Outfit'; margin-left: 0.5rem;">File Viewer</div>
        </div>
        <div style="display: flex; gap: 0.5rem; align-items: center;">
            <div id="page-indicator" class="glass" style="padding: 0.4rem 0.8rem; border-radius: 20px; font-size: 0.8rem; font-weight: 700;">
                <span id="page-num">1</span> / <span id="page-count">-</span>
            </div>
            <div id="full-screen-toggle" class="eye-btn" title="Full Screen">
                <i class="fas fa-expand"></i>
            </div>
        </div>
    </header>

    <div class="desktop-main-wrapper">
        <aside id="desktop-sidebar">
            <div class="sidebar-subject-title">Loading...</div>
            <div id="sidebar-items-container" style="display: flex; flex-direction: column; gap: 0.8rem;">
                <!-- PDF Bars injected here -->
            </div>
        </aside>

        <div id="pdf-container" class="no-scrollbar">
            <div id="loading-overlay" class="loading-overlay">
                <div class="premium-loader-container">
                    <img src="smacklogo_home.png" alt="Logo" style="width: 180px; margin-bottom: 2rem;">
                    <div class="loader-progress-bar">
                        <div class="loader-progress-fill"></div>
                    </div>
                    <p id="loading-status" class="loader-status-text">INITIALIZING ENGINE...</p>
                </div>
            </div>
            <div id="canvas-wrapper" class="main-canvas-wrapper">
                <canvas id="pdf-canvas"></canvas>
            </div>
        </div>

        <!-- Floating Download Button -->
        <button id="floating-download" class="floating-dl-btn" title="Download Material">
            <i class="fas fa-download"></i>
            <span>Download PDF</span>
        </button>

        <!-- New Bottom Navigation Bar -->
        <div class="bottom-nav-bar glass">
            <div class="slider-container">
                <span style="font-size: 0.75rem; font-weight: 600;">1</span>
                <input type="range" id="page-slider" min="1" max="1" value="1">
                <span id="max-page-label" style="font-size: 0.75rem; font-weight: 600;">-</span>
            </div>
            <div id="thumbnail-bar" class="thumbnail-bar">
                <!-- Thumbnails injected here -->
            </div>
        </div>
    </div>

    <!-- Toast -->
    <div id="cg-toast"></div>

    <!-- Security Overlay -->
    <div id="security-alert-overlay" style="display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(15, 23, 42, 0.95); backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px); z-index: 99999; align-items: center; justify-content: center; text-align: center; color: white; font-family: 'Plus Jakarta Sans', sans-serif;">
        <div style="max-width: 400px; padding: 2.5rem; border-radius: 24px; border: 1px solid rgba(239, 68, 68, 0.2); background: rgba(255, 255, 255, 0.03); box-shadow: 0 20px 50px rgba(0,0,0,0.5); transform: scale(0.9); animation: successPop 0.4s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;">
            <i class="fas fa-shield-alt" style="font-size: 4.5rem; color: #ef4444; margin-bottom: 1.5rem; display: block;"></i>
            <h2 style="font-family: 'Outfit'; font-weight: 800; font-size: 1.8rem; margin-bottom: 1rem; color: #ef4444;">Security Alert</h2>
            <p style="color: #94a3b8; font-size: 0.95rem; line-height: 1.6; margin-bottom: 2rem;">Screenshots and screen recordings are strictly restricted on this platform to protect copyrighted notes.</p>
            <div style="font-size: 0.8rem; color: #64748b; border-top: 1px solid rgba(255,255,255,0.05); padding-top: 1.5rem;">
                Click anywhere on the screen to restore the content.
            </div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.4.120/pdf.min.js"></script>
    <script type="module">
        import { auth, fs, doc, getDoc } from "./firebase-config.js";
        import { subjectMaterials } from "./materials.js";

        const toast = document.getElementById('cg-toast');

        let fileUrl = null;
        let fileTitle = null;
        let isLoggedIn = false;

        // ── Toast helper
        function showToast(msg, color = 'white') {
            toast.textContent = msg;
            toast.style.borderColor = color === 'white' ? 'rgba(255,255,255,0.1)' : color;
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 3000);
        }

        // ── Trigger actual download
        function triggerDownload() {
            const a = document.createElement('a');
            a.href = fileUrl;
            a.download = fileTitle || 'cupcake_material.pdf';
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
        }

        // ── Auth state — track login
        auth.onAuthStateChanged((user) => {
            isLoggedIn = !!user;
        });

        // ── Unified Download logic
        const handleDownload = () => {
            if (!fileUrl || fileUrl === '#') {
                showToast('No file available to download.');
                return;
            }
            if (!isLoggedIn) {
                showToast('Please log in to download.');
                return;
            }
            triggerDownload();
            showToast('Download started', 'white');
        };

        const floatDlBtn = document.getElementById('floating-download');
        if (floatDlBtn) {
            floatDlBtn.onclick = handleDownload;
        }

        // ── Expose fileUrl setter for the main script below
        window.__setCaptchaFile = (url, title) => { fileUrl = url; fileTitle = title; };
    </script>
    <script>
        const { pdfjsLib } = globalThis;
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.4.120/pdf.worker.min.js';

        let pdfDoc = null,
            pageNum = 1,
            pageIsRendering = false,
            pageNumIsPending = null,
            scale = 1.3,
            canvas = document.getElementById('pdf-canvas'),
            ctx = canvas.getContext('2d'),
            canvasWrapper = document.getElementById('canvas-wrapper');

        // Zoom & Pan State
        let currentScale = 1;
        let initialDistance = 0;
        let isPanning = false;
        let startX, startY;
        let translateX = 0, translateY = 0;
        const isDesktop = () => window.innerWidth >= 1024;

        // Render the main page
        const renderPage = (num, direction = null) => {
            if (isDesktop()) {
                const targetPage = document.getElementById(`page-wrapper-${num}`);
                if (targetPage) {
                    targetPage.scrollIntoView({ behavior: 'smooth', block: 'start' });
                }
                return;
            }

            if (pageIsRendering) {
                pageNumIsPending = num;
                return;
            }
            
            pageIsRendering = true;

            // Apply slide effect
            if (direction === 'next') canvasWrapper.classList.add('sliding-left');
            if (direction === 'prev') canvasWrapper.classList.add('sliding-right');

            setTimeout(() => {
                pdfDoc.getPage(num).then(page => {
                    const viewport = page.getViewport({ scale });
                    canvas.height = viewport.height;
                    canvas.width = viewport.width;

                    const renderCtx = {
                        canvasContext: ctx,
                        viewport
                    };

                    page.render(renderCtx).promise.then(() => {
                        pageIsRendering = false;
                        
                        // Clear animation classes and trigger fade-in
                        canvasWrapper.classList.remove('sliding-left', 'sliding-right');
                        
                        if (pageNumIsPending !== null) {
                            renderPage(pageNumIsPending);
                            pageNumIsPending = null;
                        }
                    });

                    // Update UI state
                    document.getElementById('page-num').textContent = num;
                    document.getElementById('page-slider').value = num;
                    updateActiveThumbnail(num);
                    
                    // Reset zoom on page change
                    resetZoom();
                });
            }, direction ? 150 : 0);
        };

        const resetZoom = () => {
            currentScale = 1;
            translateX = 0;
            translateY = 0;
            updateTransform();
        };

        const updateTransform = () => {
            if (!isDesktop()) {
                canvasWrapper.style.transform = `translate(${translateX}px, ${translateY}px) scale(${currentScale})`;
            }
        };

        const renderAllPages = async () => {
            const container = document.getElementById('pdf-container');
            container.innerHTML = ''; // Clear existing
            
            // 1. Pre-create all page wrappers (Skeletons) for immediate scrollbar accuracy
            for (let i = 1; i <= pdfDoc.numPages; i++) {
                const pageWrapper = document.createElement('div');
                pageWrapper.className = 'main-canvas-wrapper desktop-page-skeleton';
                pageWrapper.id = `page-wrapper-${i}`;
                pageWrapper.dataset.page = i;
                
                // Temporary placeholder content
                pageWrapper.innerHTML = `<div class="page-skeleton-loader">Loading Page ${i}...</div>`;
                container.appendChild(pageWrapper);
            }

            const observerOptions = {
                root: container,
                threshold: 0.2
            };

            const observer = new IntersectionObserver((entries) => {
                entries.forEach(entry => {
                    if (entry.isIntersecting) {
                        const pageNumAtScroll = parseInt(entry.target.dataset.page);
                        pageNum = pageNumAtScroll;
                        document.getElementById('page-num').textContent = pageNumAtScroll;
                        const slider = document.getElementById('page-slider');
                        if (slider) slider.value = pageNumAtScroll;
                        updateActiveThumbnail(pageNumAtScroll);
                    }
                });
            }, observerOptions);

            // 2. Sequentially render high-quality canvases
            for (let i = 1; i <= pdfDoc.numPages; i++) {
                const page = await pdfDoc.getPage(i);
                const pageWrapper = document.getElementById(`page-wrapper-${i}`);
                if (!pageWrapper) continue;

                const viewport = page.getViewport({ scale: 1.5 });
                const pageCanvas = document.createElement('canvas');
                pageCanvas.height = viewport.height;
                pageCanvas.width = viewport.width;
                
                // Replace loader with canvas
                pageWrapper.innerHTML = '';
                pageWrapper.appendChild(pageCanvas);

                const renderCtx = {
                    canvasContext: pageCanvas.getContext('2d'),
                    viewport
                };
                await page.render(renderCtx).promise;
                observer.observe(pageWrapper);
            }
        };

        const updateActiveThumbnail = (num) => {
            // Bottom Bar Sync
            const thumbs = document.querySelectorAll('.thumbnail-item');
            thumbs.forEach(t => t.classList.remove('active'));
            const activeThumb = document.getElementById(`thumb-${num}`);
            if (activeThumb) {
                activeThumb.classList.add('active');
                activeThumb.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'center' });
            }

            // Sidebar Sync (Desktop)
            const sidebarThumbs = document.querySelectorAll('.sidebar-thumb-item');
            sidebarThumbs.forEach(t => t.classList.remove('active'));
            const activeSidebarThumb = document.getElementById(`sidebar-thumb-${num}`);
            if (activeSidebarThumb) {
                activeSidebarThumb.classList.add('active');
                activeSidebarThumb.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'center' });
            }
        };

        const renderThumbnails = () => {
            const thumbBar = document.getElementById('thumbnail-bar');
            const sidebarContainer = document.getElementById('sidebar-items-container');
            
            thumbBar.innerHTML = '';
            if (sidebarContainer) sidebarContainer.innerHTML = '';
            
            for (let i = 1; i <= pdfDoc.numPages; i++) {
                // Bottom Bar Thumbnail
                const thumbItem = document.createElement('div');
                thumbItem.className = 'thumbnail-item';
                thumbItem.id = `thumb-${i}`;
                thumbItem.innerHTML = `
                    <canvas id="thumb-canvas-${i}"></canvas>
                    <div class="page-label">${i}</div>
                `;
                thumbItem.onclick = () => { pageNum = i; renderPage(i); };
                thumbBar.appendChild(thumbItem);

                // Sidebar Thumbnail (Desktop Only)
                if (sidebarContainer) {
                    const sideItem = document.createElement('div');
                    sideItem.className = 'sidebar-thumb-item';
                    sideItem.id = `sidebar-thumb-${i}`;
                    sideItem.innerHTML = `
                        <div class="sidebar-thumb-canvas-wrapper">
                            <canvas id="sidebar-thumb-canvas-${i}"></canvas>
                        </div>
                        <div class="sidebar-thumb-label">Page ${i}</div>
                    `;
                    sideItem.onclick = () => { pageNum = i; renderPage(i); };
                    sidebarContainer.appendChild(sideItem);
                }

                // Render both canvases
                pdfDoc.getPage(i).then(page => {
                    // Bottom
                    const canvasT = document.getElementById(`thumb-canvas-${i}`);
                    if (canvasT) {
                        const ctxT = canvasT.getContext('2d');
                        const viewportT = page.getViewport({ scale: 0.2 });
                        canvasT.height = viewportT.height;
                        canvasT.width = viewportT.width;
                        page.render({ canvasContext: ctxT, viewport: viewportT });
                    }
                    // Sidebar
                    const canvasS = document.getElementById(`sidebar-thumb-canvas-${i}`);
                    if (canvasS) {
                        const ctxS = canvasS.getContext('2d');
                        const viewportS = page.getViewport({ scale: 0.4 }); // Higher quality for sidebar
                        canvasS.height = viewportS.height;
                        canvasS.width = viewportS.width;
                        page.render({ canvasContext: ctxS, viewport: viewportS });
                    }
                });
            }
        };

        // Touch Swipe detection
        let touchStartX = 0;
        let touchEndX = 0;

        const handleSwipe = () => {
            const threshold = 100;
            if (touchEndX < touchStartX - threshold) {
                // Swipe Left -> Next Page
                if (pageNum < pdfDoc.numPages) {
                    pageNum++;
                    renderPage(pageNum, 'next');
                }
            }
            if (touchEndX > touchStartX + threshold) {
                // Swipe Right -> Prev Page
                if (pageNum > 1) {
                    pageNum--;
                    renderPage(pageNum, 'prev');
                }
            }
        };

        document.addEventListener('DOMContentLoaded', () => {
            const urlParams = new URLSearchParams(window.location.search);
            const file = urlParams.get('file');
            const title = urlParams.get('title');
            const subject = urlParams.get('subject');

            const backLink = document.getElementById('back-link');
            const viewerTitle = document.getElementById('viewer-title');
            const downloadLink = document.getElementById('download-link');
            const fullScreenBtn = document.getElementById('full-screen-toggle');
            const loadingOverlay = document.getElementById('loading-overlay');
            const pageSlider = document.getElementById('page-slider');

            if (file) {
                const url = decodeURIComponent(file);
                const decodedTitle = title ? decodeURIComponent(title) : 'Material';
                viewerTitle.textContent = decodedTitle;
                // Pass file info to the captcha module
                if (window.__setCaptchaFile) window.__setCaptchaFile(url, decodedTitle);
                if (subject) backLink.href = `subject_details.html?subject=${subject}`;

                const loadingStatus = document.getElementById('loading-status');
                const startTime = Date.now();
                const minLoadingTime = 3000; // 3 seconds minimum

                // Handle '#' or Uploaded soon
                if (url === '#' || (title && title.toLowerCase().includes('uploaded soon'))) {
                    setTimeout(() => {
                        loadingOverlay.innerHTML = `
                            <div style="text-align: center; animation: fadeIn 0.5s ease-out;">
                                <i class="fas fa-clock" style="font-size: 3rem; color: var(--primary-light); margin-bottom: 1.5rem; display: block;"></i>
                                <h2 style="font-family: 'Outfit'; font-weight: 700; font-size: 1.8rem; margin-bottom: 0.5rem; color: white;">Upload soon...</h2>
                                <p style="color: var(--text-muted);">This resource is being prepared by our team.</p>
                                <a href="subject_details.html?subject=${subject}" class="glass" style="display: inline-block; margin-top: 2rem; padding: 0.8rem 1.5rem; border-radius: 12px; color: white; text-decoration: none; font-weight: 600;">
                                    <i class="fas fa-arrow-left"></i> Go Back
                                </a>
                            </div>
                        `;
                    }, minLoadingTime);
                    return;
                }
                // Handle HTML files (Directly injected text content)
                if (url.endsWith('.html')) {
                    loadingStatus.textContent = "Loading Study Material...";
                    fetch(url)
                        .then(response => response.text())
                        .then(html => {
                            const elapsed = Date.now() - startTime;
                            const remaining = Math.max(0, minLoadingTime - elapsed);
                            
                            setTimeout(() => {
                                // Hide loading overlay
                                loadingOverlay.style.opacity = '0';
                                setTimeout(() => loadingOverlay.style.display = 'none', 300);
                                
                                // Hide PDF-specific UI (canvas, slider, viewer controls)
                                document.getElementById('pdf-canvas').style.display = 'none';
                                if (pageSlider) pageSlider.style.display = 'none';
                                const controls = document.querySelector('.viewer-controls');
                                if (controls) controls.style.display = 'none';
                                const floatingDlBtn = document.querySelector('.floating-dl-btn');
                                if (floatingDlBtn) floatingDlBtn.style.display = 'none'; // hide floating download button for HTML-only notes
                                
                                // Create scrollable content container
                                let container = document.getElementById('html-content-container');
                                if (!container) {
                                    container = document.createElement('div');
                                    container.id = 'html-content-container';
                                    container.style.width = '95%';
                                    container.style.maxWidth = '900px';
                                    container.style.margin = '90px auto 40px auto';
                                    container.style.padding = '2rem 1.5rem';
                                    container.style.color = '#e2e8f0';
                                    container.style.fontFamily = "'Plus Jakarta Sans', sans-serif";
                                    container.style.lineHeight = '1.7';
                                    container.style.overflowY = 'auto';
                                    document.body.appendChild(container);
                                }
                                container.style.display = 'block';
                                container.innerHTML = html;
                            }, remaining);
                        })
                        .catch(err => {
                            console.error("HTML fetch error:", err);
                            loadingStatus.textContent = "Error loading material.";
                        });
                    return;
                }

                // Hide HTML notes container if it exists
                const htmlContainer = document.getElementById('html-content-container');
                if (htmlContainer) {
                    htmlContainer.style.display = 'none';
                }

                loadingStatus.textContent = "Fetching Study Material...";

                pdfjsLib.getDocument(url).promise.then(pdfDoc_ => {
                    const elapsed = Date.now() - startTime;
                    const remaining = Math.max(0, minLoadingTime - elapsed);

                    setTimeout(() => {
                        pdfDoc = pdfDoc_;
                        document.getElementById('page-count').textContent = pdfDoc.numPages;
                        document.getElementById('max-page-label').textContent = pdfDoc.numPages;
                        pageSlider.max = pdfDoc.numPages;
                        
                        loadingOverlay.style.display = 'none';
                        if (isDesktop()) {
                            renderAllPages();
                        } else {
                            canvasWrapper.style.opacity = '1';
                            canvasWrapper.style.pointerEvents = 'auto';
                            renderPage(pageNum);
                        }
                        renderThumbnails();
                    }, remaining);
                }).catch(err => {
                    console.error("PDF Load error:", err);
                    setTimeout(() => {
                        loadingOverlay.innerHTML = `
                            <div style="text-align: center; padding: 2rem; animation: fadeIn 0.5s ease-out; max-width: 400px; margin: auto;">
                                <i class="fas fa-exclamation-triangle" style="font-size: 3rem; color: #f59e0b; margin-bottom: 1.5rem; display: block;"></i>
                                <h2 style="font-family: 'Outfit'; font-weight: 700; font-size: 1.5rem; margin-bottom: 0.5rem; color: white;">Material Not Found</h2>
                                <p style="color: var(--text-muted); font-size: 0.9rem; line-height: 1.5; margin-bottom: 1.5rem;">The file for this resource has not been uploaded to the server yet.</p>
                                <div style="font-size: 0.75rem; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); padding: 0.8rem; border-radius: 8px; color: var(--text-muted); text-align: left; margin-bottom: 2rem;">
                                    <strong style="color: white; display: block; margin-bottom: 0.3rem;">Instructions for Admin:</strong>
                                    Upload the PDF file to this path: <code style="color: var(--primary-light); font-weight: 700; word-break: break-all;">${url}</code>
                                </div>
                                <a href="subject_details.html?subject=${subject || ''}" class="glass" style="display: inline-block; padding: 0.8rem 1.5rem; border-radius: 12px; color: white; text-decoration: none; font-weight: 600; transition: var(--transition);">
                                    <i class="fas fa-arrow-left" style="margin-right: 6px;"></i> Go Back
                                </a>
                            </div>
                        `;
                    }, 500);
                });

            }

            pageSlider.oninput = function() {
                pageNum = parseInt(this.value);
                renderPage(pageNum);
            };

            fullScreenBtn.onclick = () => {
                if (!document.fullscreenElement) {
                    document.documentElement.requestFullscreen();
                    fullScreenBtn.innerHTML = '<i class="fas fa-compress"></i>';
                } else {
                    document.exitFullscreen();
                    fullScreenBtn.innerHTML = '<i class="fas fa-expand"></i>';
                }
            };

            // Advanced Touch Handling (Pinch & Pan)
            canvasWrapper.addEventListener('touchstart', e => {
                if (e.touches.length === 2) {
                    // Pinch Start
                    initialDistance = Math.hypot(
                        e.touches[0].pageX - e.touches[1].pageX,
                        e.touches[0].pageY - e.touches[1].pageY
                    );
                } else if (e.touches.length === 1) {
                    // Pan Start (only if zoomed)
                    if (currentScale > 1) {
                        isPanning = true;
                        startX = e.touches[0].pageX - translateX;
                        startY = e.touches[0].pageY - translateY;
                    }
                    touchStartX = e.touches[0].screenX;
                }
            });

            canvasWrapper.addEventListener('touchmove', e => {
                if (e.touches.length === 2) {
                    // Pinching
                    e.preventDefault();
                    const currentDistance = Math.hypot(
                        e.touches[0].pageX - e.touches[1].pageX,
                        e.touches[0].pageY - e.touches[1].pageY
                    );
                    const zoomFactor = currentDistance / initialDistance;
                    currentScale = Math.min(Math.max(1, currentScale * zoomFactor), 4);
                    initialDistance = currentDistance;
                    updateTransform();
                } else if (e.touches.length === 1 && isPanning) {
                    // Panning
                    e.preventDefault();
                    translateX = e.touches[0].pageX - startX;
                    translateY = e.touches[0].pageY - startY;
                    updateTransform();
                }
            }, { passive: false });

            canvasWrapper.addEventListener('touchend', e => {
                if (e.touches.length < 2) initialDistance = 0;
                if (e.touches.length === 0) {
                    isPanning = false;
                    touchEndX = e.changedTouches[0].screenX;
                    if (currentScale === 1) handleSwipe();
                }
            });

            // Security screenshot/recording prevention listeners
            const secOverlay = document.getElementById('security-alert-overlay');

            function showSecurityAlert() {
                if (secOverlay) {
                    secOverlay.style.display = 'flex';
                }
            }

            function hideSecurityAlert() {
                if (secOverlay) {
                    secOverlay.style.display = 'none';
                }
            }

            // Window blur & visibility change to detect screenshot tool / window switching
            window.addEventListener('blur', showSecurityAlert);
            document.addEventListener('visibilitychange', () => {
                if (document.hidden) {
                    showSecurityAlert();
                }
            });

            // Click overlay or window focus to dismiss
            if (secOverlay) {
                secOverlay.addEventListener('click', hideSecurityAlert);
            }
            window.addEventListener('focus', hideSecurityAlert);

            // Prevent right-click context menu
            document.addEventListener('contextmenu', e => {
                e.preventDefault();
            });

            // Keyboard navigation & Intercept copy/save/print shortcut keys
            window.addEventListener('keydown', e => {
                // Keydown navigation
                if (e.key === 'ArrowLeft') {
                    if (pageNum > 1) { pageNum--; renderPage(pageNum, 'prev'); }
                }
                if (e.key === 'ArrowRight') {
                    if (pageNum < pdfDoc.numPages) { pageNum++; renderPage(pageNum, 'next'); }
                }

                // Intercept print (Ctrl+P / Cmd+P)
                if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'p') {
                    e.preventDefault();
                    showSecurityAlert();
                }

                // Intercept save page (Ctrl+S / Cmd+S)
                if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 's') {
                    e.preventDefault();
                    showSecurityAlert();
                }

                // Intercept copy (Ctrl+C / Cmd+C)
                if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'c') {
                    e.preventDefault();
                    showSecurityAlert();
                }

                // Intercept inspect elements (F12)
                if (e.key === 'F12') {
                    e.preventDefault();
                    showSecurityAlert();
                }

                // Intercept DevTools shortcut (Ctrl+Shift+I)
                if (e.ctrlKey && e.shiftKey && e.key.toLowerCase() === 'i') {
                    e.preventDefault();
                    showSecurityAlert();
                }

                // Intercept PrintScreen key
                if (e.key === 'PrintScreen' || e.keyCode === 44) {
                    e.preventDefault();
                    try {
                        navigator.clipboard.writeText("Screenshots are restricted on this platform.");
                    } catch (err) {}
                    showSecurityAlert();
                }
            });

            // Delegated click handler for HTML notes interactive elements
            document.addEventListener('click', (e) => {
                const toggleBtn = e.target.closest('#toggle-exercises-btn');
                const backBtn = e.target.closest('#back-to-study-btn');
                const answerBtn = e.target.closest('.show-answers-btn');
                const container = document.getElementById('html-content-container');

                if (toggleBtn) {
                    const study = document.getElementById('study-notes-section');
                    const exercises = document.getElementById('exercises-section');
                    if (study && exercises) {
                        study.style.display = 'none';
                        exercises.style.display = 'block';
                        if (container) {
                            container.scrollTop = 0;
                        } else {
                            window.scrollTo({ top: 0, behavior: 'smooth' });
                        }
                    }
                }

                if (backBtn) {
                    const study = document.getElementById('study-notes-section');
                    const exercises = document.getElementById('exercises-section');
                    if (study && exercises) {
                        exercises.style.display = 'none';
                        study.style.display = 'block';
                        if (container) {
                            container.scrollTop = 0;
                        } else {
                            window.scrollTo({ top: 0, behavior: 'smooth' });
                        }
                    }
                }

                if (answerBtn) {
                    const targetId = answerBtn.dataset.target;
                    const ans = document.getElementById(targetId);
                    if (ans) {
                        if (ans.style.display === 'none' || ans.style.display === '') {
                            ans.style.display = 'block';
                            answerBtn.textContent = 'Hide Answer';
                            answerBtn.style.background = 'rgba(239, 68, 68, 0.1)';
                            answerBtn.style.borderColor = 'rgba(239, 68, 68, 0.3)';
                            answerBtn.style.color = '#f87171';
                        } else {
                            ans.style.display = 'none';
                            answerBtn.textContent = 'Show Answer';
                            answerBtn.style.background = 'rgba(5, 150, 105, 0.1)';
                            answerBtn.style.borderColor = 'rgba(5, 150, 105, 0.3)';
                            answerBtn.style.color = 'var(--primary-light)';
                        }
                    }
                }
            });
        });
    </script>
</body>
</html>
